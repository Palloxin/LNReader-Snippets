<html><head></head><body><div id="LNReader-chapter">

#1<p>9 o’clock at night.</p>
#2<p>ten o’clock in the evening.</p>
#3<p>aaa o’clock at night</p>
#4<p>aaa o'clock buu</p>
#5<p>aaa 12p.m. buu</p>
#6<p>aa 5 o’clock buu</p>
#7<p>aa eight o’clock buu</p>
#8<p>Input 2</p>
#9<p>Input 2</p>
#10<p>Input 2</p>
#11<p>Input 2</p>



</div></body>
  
<script>
//↓↓↓↓ Snippet
/////↓↓↓↓↓↓↓↓↓↓ 12h→24h time format
chapter = document.querySelector('#LNReader-chapter');
chapter.innerHTML = chapter.innerHTML
.replace(/\b(?<!:|\d-)(?:[1-9]|1[012]|0\d(?=[:\.]\d))(?:[\.:][0-5]\d)?(?:-| ?[AaPp]\.?[mM](?=\.[^\.]|\b))/g, '••••$&')//♦
//↓ the . of ``a/pm.`` ends a phrase and continues
.replace(/••••([\d:\s]+[ap])\.?m\b/gi, (_, a)=> `••••${a.toLowerCase()}m.`)
//↓ cases like 3-4 pm
.replace(/••••((?!12)\d+)-(\d+)\s*([ap]\.?m\b)/gi, '••••$1 $3°°-°°••••$2 $3.')
//↓ \d AM/PM indicates a different acronym
.replace(/••••(?<=\bwith •+)(\d+ [ap])\.?m\b/g, (_, a) => `${a.toUpperCase()}M`)
//↓ exception
.replace(/••••12([:\.]\d+)?\s*([ap])\.?m(?:\.|\b)/g, (_, z,i)=> `${i==='a'?'00':'12'}${z||':00'}`)

.replace(/••••(\d+)(?:[:\.](\d\d))?\s*([ap])m(?:\.|\b)/g, (_, a,b,c)=>{
    const h = +a;
    const m = +b || 0;
    if(c === "a")
      return `${h}:${`${m}`.padStart(2,"0")}`;
    else
      return `${(h+12)%24}:${`${m}`.padStart(2,"0")}`;
})

//↓ o’clock
.replace(/[\'’]clock(?<=\b(\w+) o[\'’]clock)\b/g, (_, a) => `’clock${{two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11}[a.toLowerCase()]||a}`)
.replace(/\b(?:[1-9]|1[01]|[A-Za-z]+) o’clock(\w+)( (?:at|in the)\b(?<=\D(?:[7-9]|1[01]) (?:at|in the)) (?:night|evening)| in\b(?<=[1-9] in) the afternoon)?\b/g, (_, a,b) => `${b?+a+12:a} o’clock${b||''}`)
//↑
.replace(/(:\d\d|\b[AP]M)\.(?=[\.\,]|\s+[a-z])/g, '$1')
.replace(/°°-°°/g, ' - ')//sixth spaces
.replace(/••••(?=\d)/g, '')
;
/////↑↑↑↑↑↑↑↑↑↑ – END
//↑↑↑↑

//↓↓ Verification Code: wanted output
chapter.innerHTML = chapter.innerHTML
.replace(/#1(?=<p>21 o’clock at night\b)/, '✔️')
.replace(/#2(?=<p>22 o’clock in the evening\b)/, '✔️')
.replace(/#3(?=<p>aaa o’clock at night\b)/, '✔️')
.replace(/#4(?=<p>aaa o’clock buu\b)/, '✔️')
.replace(/#5(?=<p>aaa 12:00 buu)/, '✔️')
.replace(/#6(?=<p>aa 5 o’clock buu\b)/, '✔️')
.replace(/#7(?=<p>aa 8 o’clock buu\b)/, '✔️')
.replace(/#8(?=)/, '✔️')
.replace(/#9(?=)/, '✔️')
.replace(/#10(?=)/, '✔️')
.replace(/#11(?=)/, '✔️')



.replace(/#\d/g, '✖️$&')
chapter.innerText = chapter.outerHTML
//↑↑ 
</script>
</html>
